name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows application
        shell: pwsh
        run: dotnet build ./src/AutoPack.WinForms -c Release
      - name: Test DPAPI, archive recovery, cancellation and publish conflicts
        shell: pwsh
        run: |
          $env:AUTO_PACK_7ZIP = (Resolve-Path ./tools/7zip/7za.exe).Path
          dotnet run --project ./tests/AutoPack.Tests -c Release
